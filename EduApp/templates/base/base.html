<!-- подключение статических файлов -->
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <!-- подключение кодировки -->
    <meta charset="utf-8">

    <!--bootstrap кодировка -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EduPlatform</title>

    <!-- bootstrap стили -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Иконки Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <!--стили из папки статик-->
    <link href="{% static 'css/exam_subjects_page.css' %}" rel="stylesheet">
    <link href="{% static 'css/main_page.css' %}" rel="stylesheet">
    <link href="{% static 'css/account_page.css' %}" rel="stylesheet">
    <link href="{% static 'css/books_page.css' %}" rel="stylesheet">
    <link href="{% static 'css/tst_page.css' %}" rel="stylesheet">
    <link href="{% static 'css/auth_page.css' %}" rel="stylesheet">
    <link href="{% static 'css/number_page.css' %}" rel="stylesheet">
    <link href="{% static 'css/login_page.css' %}" rel="stylesheet">





</head>
<body>
    <header>
        {% include "../block/header.html" %}
    </header>

    <main class="flex-grow-1 py-5">
        {% block contentMain %}

        {% endblock %}
    </main>

    <footer class="text-white py-4">
        {% include "../block/footer.html" %}
    </footer>


    <!-- bootstrap скрипт -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!--скрипты из папки статик-->
    <script src="{% static 'js/main_page.js' %}"></script>

    <script src="{% static 'js/exam_subjects_page.js' %}"></script>

    <script src="{% static 'js/account_page.js' %}"></script>

    <script src="{% static 'js/books_page.js' %}"></script>

    <script src="{% static 'js/tst_page.js' %}"></script>

    <script src="{% static 'js/auth_page.js' %}"></script>

    <script src="{% static 'js/number_page.js' %}"></script>

    <script src="{% static 'js/login_page.js' %}"></script>
</body>
</html>
